name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
          cache: false
      - run: go mod tidy -diff
      - run: go mod verify
      - name: Verify changelog entry
        run: grep -F "## [${GITHUB_REF_NAME#v}]" CHANGELOG.md
      - run: go test ./...
      - name: Warm module proxy
        run: GOPROXY=https://proxy.golang.org go list -m github.com/arrowhr/ruleengine@${GITHUB_REF_NAME}

