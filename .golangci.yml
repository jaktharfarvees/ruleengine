version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errcheck
    - errorlint
    - exhaustive
    - forbidigo
    - goconst
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - nilerr
    - noctx
    - predeclared
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - wastedassign
    - whitespace
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    staticcheck:
      checks:
        - all
        - -QF*
    gocritic:
      disabled-checks:
        - ifElseChain
    revive:
      rules:
        - name: exported
    forbidigo:
      forbid:
        - pattern: '^fmt\.Print.*$'
          msg: use the caller's logger; library code must not print
        - pattern: '^time\.Now$'
          msg: inject clock.Clock outside internal/clock
        # Money and rate values must stay exact. internal/decimalx owns the
        # conversions, and resolve/filter.go plus the engine convert a caller's
        # native float through its shortest decimal representation.
        - pattern: '^strconv\.ParseFloat$'
          msg: parse through decimalx.Parse so money and rate values stay exact
        - pattern: '^math/big\.'
          msg: use internal/decimalx rather than math/big directly
      analyze-types: true
  exclusions:
    rules:
      # Repeated fixture values, deterministic pseudo-random test order, and
      # deliberate nil-context boundary tests are not production findings.
      - path: _test\.go
        linters: [forbidigo, goconst, gocritic, gosec, staticcheck, unparam]
      # Command-line tools and runnable examples intentionally write to their
      # user-facing stdout stream.
      - path: ^cmd/
        linters: [forbidigo]
      - path: ^examples/
        linters: [forbidigo]
      # These conversions validate generic JSON Schema numbers, not money.
      - path: ^schema/
        linters: [forbidigo]
      # Deadlines and elapsed-duration telemetry require the monotonic process
      # clock; business time still comes only from request Params.
      - path: ^fact/resolver\.go$
        linters: [forbidigo]
      - path: ^pipeline\.go$
        linters: [forbidigo]
      - path: ^audit/
        linters: [forbidigo]
      # Public contract names are fixed by the v2 specification.
      - path: ^fact/source\.go$
        linters: [revive]
      - path: ^rule/(catalog|key|logic|rule)\.go$
        linters: [revive]
      # The token is a subject identifier placeholder, not a credential.
      - path: ^dataset/guard\.go$
        linters: [gosec]
      - path: internal/clock/clock.go
        linters: [forbidigo]
      - path: internal/decimalx/
        linters: [forbidigo]

formatters:
  enable:
    - gofmt
    - goimports

